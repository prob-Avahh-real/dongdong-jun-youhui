name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: echo "HTML + JS project - CI placeholder"
      - name: Run tests
        run: |
          if [ -f test/game.test.js ]; then
            echo "Tests found - run with Node.js test runner"
          else
            echo "No tests configured"
          fi
